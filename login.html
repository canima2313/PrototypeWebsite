<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mOGu</title>
    <link rel="stylesheet" href="./css/components.css">
    <link rel="stylesheet" href="./css/register.css">
</head>
<body>
    <div id="nav"></div>

    <section class="user-form">
        <h1>Welcome Back</h1>
        <form id="login">
            <div class="inputs">
                <input id="email"type="text" placeholder="YourEmail@example.com" class="text">
                <p id="e2"></p>
                <input id="pass" type="password" placeholder="Password" class="text">
                <p id="e4"></p>
                <div class="cb">
                    <input type="checkbox" id="toggle-pass">
                    <label for="toggle-pass">Show password</label>
                </div>
                <button type="submit">Log in</button>
            </div>
        </form>
        <span>Don't have an account yet?<a href="./register.html">Register</a></span> 
    </section>

    <footer id="footer"></footer>

    <script src="./javascript/components.js"></script>
    <script>
        renderNavbar();
        renderFooter();
    </script>
    <script src="./javascript/login.js"></script>
</body>
</html>
