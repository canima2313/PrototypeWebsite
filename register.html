<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mOGu</title>
    <link rel="stylesheet" href="./css/components.css">
    <link rel="stylesheet" href="./css/register.css">
</head>
<body>
    <div id="nav"></div>

    <section class="user-form">
        <h1>Create an Account</h1>
        <form id="regist">
            <div class="container">
                <img src="" alt="preview" id="preview" style="display:none; width:200px; margin-top:10px;">
                <input type="file" accept="image/*" onchange="previewImg(event)">
            </div>
            <div class="inputs">
                <input id="name" type="text" placeholder="Full name">
                <input id="email"type="text" placeholder="YourEmail@example.com">
                <input id="age"  type="text" placeholder="Your age">
                <input id="pass" type="text" placeholder="Password">
                <input id="conf" type="text" placeholder="Confirm password">
                <button type="submit">Create Account</button>
            </div>
        </form> 
    </section>

    <footer id="footer"></footer>
    
    <script src="./javascript/components.js"></script>
    <script src="./javascript/register.js"></script>
    <script>
        renderNavbar();
        renderFooter();
    </script>
</body>
</html>
