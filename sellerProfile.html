<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mOGu - Seller Profile</title>
    <link rel="stylesheet" href="./css/components.css">
    <link rel="stylesheet" href="./css/viewProfile.css">
</head>
<body>
    <div id="nav"></div>

    <section class="user">
        <div class="container">
            <div class="inner-container">
                <div class="img">
                    <img id="pfp" src="" alt="profile">
                </div>
                <div class="text">
                    <h1 id="name"></h1>
                    <h4 id="email"></h4>
                </div>
            </div>
            <div class="card-container">
                <div class="card">
                    <p class="top">Age</p>
                    <p class="content" id="age"></p>
                </div>
                <div class="card">
                    <p class="top">Products</p>
                    <p class="content" id="prod-count"></p>
                </div>
            </div>
        </div>
    </section>

    <section class="products">
        <h2 style="margin:0 0 2vh;font-size:1.4rem;">Products</h2>
        <div class="prod-grid" id="prod-grid"></div>
    </section>

    <footer id="footer"></footer>
    <script src="./javascript/components.js"></script>
    <script>
        renderNavbar();
        renderFooter();
    </script>
    <script src="./javascript/sellerProfile.js"></script>
</body>
</html>
